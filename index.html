<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEE6DC">
<title>归光 · 六爻排盘</title>
<style>
  :root{
    --bg:#EBE3D8; --bg2:#F4EDE4; --card:#FFFDF9; --card2:#FAF5EF;
    --ink:#2C2C2C; --mut:#8A8A8A; --line:rgba(60,45,35,.08);
    --acc:#D4735F; --acc-soft:#F0D9D0; --gold:#C4A882; --green:#7A9B7E; --blue:#7E93B5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    margin:0;
    color:var(--ink);line-height:1.55;
    overflow:hidden;
    overscroll-behavior:none;
    height:100vh;height:100dvh;
    display:flex;
  }
  html,body{overscroll-behavior-x:none;overscroll-behavior-y:none}
  .shell{max-width:620px;margin:0 auto;padding:0 16px;box-sizing:border-box;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
  #deck{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

  /* —— 背景光斑（呼吸感：缓慢漂移 + 明暗呼吸） —— */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2))}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:multiply;opacity:.5}
  .b1{width:420px;height:420px;background:radial-gradient(circle at 35% 35%,rgba(212,115,95,.42),rgba(212,115,95,.15) 60%,transparent 75%);top:-90px;left:-110px;animation:drift1 16s ease-in-out infinite}
  .b2{width:360px;height:360px;background:radial-gradient(circle at 60% 30%,rgba(196,168,130,.5),rgba(196,168,130,.18) 62%,transparent 78%);top:18%;right:-120px;animation:drift2 20s ease-in-out infinite}
  .b3{width:340px;height:340px;background:radial-gradient(circle at 50% 40%,rgba(240,217,208,.85),rgba(240,217,208,.35) 60%,transparent 80%);bottom:-70px;left:22%;animation:drift3 24s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(34px,46px) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.08)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-36px) scale(1.15)}}

  /* —— 头部 —— */
  .hero{padding:18px 4px 0;position:relative;flex:0 0 auto}
  .hero h1{font-size:25px;font-weight:600;margin:0;letter-spacing:1px}

  /* —— 卡片 —— */
  .card{background:rgba(255,253,249,.48);border-radius:26px;padding:18px 18px;
    box-shadow:0 8px 40px rgba(60,45,35,.10),0 1px 6px rgba(60,45,35,.05);
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.5);margin-top:16px;position:relative;
    animation:breathe-card 7s ease-in-out infinite}
  @keyframes breathe-card{0%,100%{box-shadow:0 8px 40px rgba(60,45,35,.10),0 1px 6px rgba(60,45,35,.05)}50%{box-shadow:0 14px 56px rgba(60,45,35,.16),0 1px 10px rgba(60,45,35,.08)}}
  .card h2{font-family:"Songti SC","Kaiti SC",serif;font-size:15px;font-weight:600;margin:0 0 3px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc-soft))}
  .card .hint{color:var(--mut);font-size:11.5px;margin:0 0 10px;padding-left:12px}

  /* —— 输入 —— */
  #inCard{display:flex;flex-direction:column}
  textarea#src{width:100%;min-height:170px;flex:1 1 auto;resize:none;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.85);padding:16px;font-size:16px;font-family:inherit;color:var(--ink);line-height:1.9;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  textarea#src:focus{border-color:rgba(212,115,95,.5);box-shadow:0 0 0 4px rgba(212,115,95,.10)}
  textarea#src::placeholder{color:#B9B0A6;font-family:"Kaiti SC",serif}
  .ibar{display:flex;gap:10px;margin-top:14px;flex:0 0 auto}
  .ibar .btn{flex:1;font-size:13.5px;padding:12px 0;letter-spacing:1px}
  .btn{flex:1;border:none;border-radius:999px;padding:15px 0;font-size:16px;cursor:pointer;transition:transform .12s,box-shadow .2s;
    -webkit-appearance:none;appearance:none}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--acc),#E8917A);color:#fff;box-shadow:0 10px 22px rgba(212,115,95,.32);font-weight:500;letter-spacing:2px}
  .btn.sec{background:rgba(196,168,130,.18);color:#8a6d45;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(196,168,130,.35)}
  .btnrow{margin-top:14px;display:flex;gap:12px}
  .btnrow .btn{flex:1}
  .btnrow .btn.primary{padding:16px 0;letter-spacing:2px;white-space:nowrap}

  /* —— 错误 —— */
  .err{color:#b0563f;background:rgba(212,115,95,.10);border-radius:16px;padding:14px 16px;margin-top:20px;font-size:14px;border:1px solid rgba(212,115,95,.20)}

  /* —— 结果通用 —— */
  .wrap{display:none}
  .tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;margin:8px 5px 0 0}
  .tag.hot{background:var(--acc-soft);color:#a7573f}
  .tag.gold{background:rgba(196,168,130,.20);color:#8a6d45}
  .tag.green{background:rgba(122,155,126,.18);color:#5c7a60}
  .tag.blue{background:rgba(126,147,181,.18);color:#50657f}
  .tag.plain{background:rgba(60,45,35,.07);color:var(--mut)}

  /* 四柱信息格 */
  .cscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;margin:2px -4px 0 0;padding-right:4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:2px}
  .cell{background:rgba(255,255,255,.65);border-radius:11px;padding:5px 9px;border:1px solid var(--line)}
  .cell .k{font-size:9.5px;color:var(--mut);letter-spacing:.4px;margin-bottom:1px}
  .cell .v{font-size:12.5px;font-weight:600}
  .cell .small{font-size:9.5px;color:var(--mut);margin-top:1px}
  .cell.full{grid-column:1/-1}
  .shensha{font-size:10.5px;color:#6d5a4a;letter-spacing:.2px}
  .ss-tag{display:inline-block;background:rgba(196,168,130,.14);border-radius:8px;padding:1px 5px;margin:2px 3px 0 0;font-size:10.5px}

  /* —— 逐爻：六爻 grid 均分固定填满一屏（绝不出滚动），下方伏神矮行 —— */
  .yaos{display:grid;grid-template-rows:repeat(6,minmax(0,1fr)) auto;gap:5px;margin-top:6px;flex:1 1 auto;min-height:0;align-content:stretch}
  .yoa{min-height:0;display:flex;flex-direction:column;
    background:rgba(255,255,255,.62);border-radius:10px;padding:3px 8px;border:1px solid rgba(255,255,255,.74);
    position:relative;overflow:hidden;transition:box-shadow .25s,border-color .25s,background .25s}
  .yoa.dong{background:linear-gradient(135deg,rgba(212,115,95,.14),rgba(255,255,255,.62));border-color:rgba(212,115,95,.30)}
  .yoa .yrow{display:flex;align-items:center;gap:2px 6px;line-height:1.2;flex:0 0 auto}
  .yoa .nm{font-family:"Songti SC","STSong",serif;font-size:11.5px;font-weight:700;flex:none}
  .yoa .shi{font-size:9px;color:#a7573f;background:var(--acc-soft);border-radius:999px;padding:0 5px;flex:none}
  .yoa .dongtag{font-size:9px;color:#fff;background:var(--acc);border-radius:999px;padding:0 5px;flex:none}
  .yoa .sp{font-size:9.5px;color:var(--mut);white-space:nowrap;flex:none;margin-left:auto}
  /* 卡内三栏：本卦 ⇆ 之卦/变爻 */
  .ycols{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;margin-top:1px;flex:1 1 auto;min-height:0;align-items:stretch}
  .ycols.solo{grid-template-columns:1fr;gap:0}
  .ycols.solo .bmain{justify-content:center}
  .yoa .bmain,.yoa .bcol{background:rgba(60,45,35,.05);border-radius:7px;padding:2px 6px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;min-width:0}
  .yoa .bcol.zhidim{opacity:.6}
  .yoa .q{font-size:11px;font-weight:600;line-height:1.3;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yoa .q .nochg{font-size:8.5px;color:var(--gold);font-weight:600;margin-left:3px}
  .st{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
  .st i{font-style:normal;display:inline-flex;align-items:center;height:13px;line-height:13px;padding:0 4px;border-radius:3px;font-size:9px;white-space:nowrap}
  .st i.m{color:#50657f;background:rgba(126,147,181,.18)}
  .st i.d{color:#5c7a60;background:rgba(122,155,126,.18)}
  .st i.k{color:#8a6d45;background:rgba(196,168,130,.24)}
  .st i.p{color:#b95b4e;background:rgba(185,91,78,.16);font-weight:600}
  .st i.r{color:#6d6257;background:rgba(138,127,110,.14)}
  .yoa .arw{display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:600;font-size:12px;flex:none}
  .yoa .arw.mute{color:rgba(60,45,35,.22)}
  /* 伏神：两张小卡，自然矮行 */
  .fubar{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .fubar .fuhd{font-size:10px;color:var(--mut);flex:none}
  .fs{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 auto;min-width:0}
  .fsc{background:rgba(255,255,255,.62);border:1px solid rgba(122,155,126,.45);border-left:3px solid var(--green);border-radius:7px;padding:2px 6px;display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
  .fsc .fq{font-size:10px;font-weight:600;flex:none}
  .fsc .fm{font-size:8.5px;color:var(--mut);flex:none}
  .fsc .st{margin-top:0}
  /* 三合局：并入标题行的成局按钮 */
  .sjrow{margin:0 0 0 auto;display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto;justify-content:flex-end}
  .sjbtn{font-size:11px;color:#fff;border:1px solid transparent;border-radius:999px;padding:5px 13px;cursor:pointer;transition:.25s;letter-spacing:.5px;flex:none}
  .sjbtn.blue{background:linear-gradient(90deg,#50657f,#7e93b5);box-shadow:0 3px 10px rgba(80,101,127,.32)}
  .sjbtn.fire{background:linear-gradient(90deg,#a7573f,#d4735f);box-shadow:0 3px 10px rgba(167,87,63,.32)}
  .sjbtn.gold{background:linear-gradient(90deg,#8a6d45,#c4a882);box-shadow:0 3px 10px rgba(138,109,69,.32)}
  .sjbtn.metal{background:linear-gradient(90deg,#6d6a63,#9a948a);box-shadow:0 3px 10px rgba(95,90,82,.32)}
  .sjbtn.green{background:linear-gradient(90deg,#5c7a60,#84a78a);box-shadow:0 3px 10px rgba(92,122,96,.32)}
  .sjbtn.off{opacity:.55;filter:saturate(.5)}
  .sjbtn.on{opacity:1;filter:none;box-shadow:0 0 0 2px rgba(255,255,255,.65),0 5px 18px rgba(0,0,0,.22)}
  .sjbtn.s:not(.on){box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}

  /* 卦局主卡 */
  .gujua{display:flex;gap:10px;margin-top:6px;align-items:stretch}
  .gua{flex:1 1 0;min-width:0;background:rgba(255,255,255,.6);border-radius:14px;padding:9px 12px;border:1px solid var(--line)}
  .gua .gtop{display:flex;align-items:baseline;gap:7px;flex-wrap:nowrap}
  .gua .dummy{font-size:10.5px;color:var(--mut);letter-spacing:.5px;flex:none}
  .gua .nm{font-family:"Songti SC","Kaiti SC",serif;font-size:18px;font-weight:600;flex:none;letter-spacing:.5px}
  .gua .wc{font-size:10.5px;border-radius:999px;padding:1px 9px;background:var(--acc-soft);color:#a7573f;flex:none;margin-left:auto;white-space:nowrap}
  .gua .gmeta{font-size:11px;color:var(--mut);margin-top:5px;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
  .gua .gbrow{display:flex;flex-wrap:wrap;gap:4px}
  .gua .gb{font-size:9.5px;border-radius:999px;padding:0 7px;font-weight:500;line-height:1.6;white-space:nowrap}
  .gb.hot{background:var(--acc-soft);color:#a7573f}
  .gb.gold{background:rgba(196,168,130,.22);color:#8a6d45}
  .gb.green{background:rgba(122,155,126,.18);color:#5c7a60}
  .gb.blue{background:rgba(126,147,181,.18);color:#50657f}
  .gua-arrow{display:flex;align-items:center;color:var(--gold);font-size:15px;font-weight:600;flex:none;align-self:center}

  .moves{font-size:13px;color:var(--mut);margin-top:10px}
  .moves b{color:var(--acc)}
  .merge-sep{height:1px;background:var(--line);margin:10px 0 8px}

  /* 关灯 */
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}

  /* —— 滑动分页卡片 —— */
  .carousel{position:relative;overflow:hidden;border-radius:26px;margin-top:14px;overscroll-behavior-x:none;flex:1 1 auto;min-height:0;display:flex;width:100%}
  .ctrack{display:flex;align-items:stretch;width:100%;height:100%}
  .carousel .cpage{flex:0 0 100%;width:100%;margin-top:0;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;height:100%}
  .carousel .cpage > .grid{flex:1 1 auto;min-height:0;align-content:flex-start}
  .carousel .cpage > .yaos{flex:1 1 auto;min-height:0;margin-bottom:2px;align-content:stretch}
  #inCard.cpage{justify-content:flex-start}
  /* 输入页：彻底去除 iOS 合成层/动画，保证原生长按选择与粘贴菜单可用 */
  #inCard{-webkit-transform:none!important;transform:none!important;will-change:auto;-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,253,249,.92);animation:none!important;-webkit-touch-callout:default;-webkit-user-select:text;user-select:text;-webkit-text-size-adjust:100%}
  #inCard textarea{width:100%;min-height:150px;resize:none;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;-webkit-text-size-adjust:100%}
  #inCard .hint{margin-bottom:10px}
  #inCard .btnrow{flex:0 0 auto}
  .btnrow-main{margin-top:12px}
  .cdotrow{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:12px;flex:0 0 auto}
  .cdot{width:8px;height:8px;border-radius:999px;background:rgba(196,168,130,.35);transition:.3s;cursor:pointer}
  .cdot.on{width:22px;background:linear-gradient(90deg,var(--acc),var(--gold))}
  .cdotlab{font-size:11px;color:var(--mut);letter-spacing:1px;margin-left:4px}
  .s-good{background:var(--green)}
  .s-bad{background:var(--acc)}
  .s-mid{background:var(--gold)}

  @media (max-width:520px){
    .shell{padding:0 12px}
    .gujua{flex-direction:row}
  .gua-arrow{padding:0;transform:none}
    .hero h1{font-size:23px}
    .card{padding:18px 15px;border-radius:22px;
      animation:none;box-shadow:0 8px 30px rgba(60,45,35,.12),0 1px 6px rgba(60,45,35,.05)}
    /* 移动端稳定性：关闭超大模糊+混色光斑（iPhone Safari 由它们引起整页空白/闪屏），改用纯渐变底色 */
    .bg{background:linear-gradient(180deg,var(--bg),var(--bg2))}
    .blob{display:none}
    .bg::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(120% 55% at 14% 6%, rgba(212,115,95,.16), transparent 55%),
        radial-gradient(120% 65% at 92% 22%, rgba(196,168,130,.20), transparent 55%),
        radial-gradient(120% 80% at 45% 100%, rgba(240,217,208,.45), transparent 62%)}
  }

  /* —— 桌面端（宽屏 ≥1024px）：一屏三卡片并列显示全部内容，不轮播 —— */
  @media (min-width:1024px){
    html{height:100%}
    body{overflow:hidden}
    .shell{max-width:1400px;padding:0 22px}
    .hero{padding:16px 4px 0}
    .carousel{overflow:hidden}
    .ctrack{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
    .carousel .cpage{width:auto;flex:none;margin-top:14px;height:auto;min-width:0;
      overflow-y:auto;overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch}
    .carousel .cpage::-webkit-scrollbar{width:6px}
    .carousel .cpage::-webkit-scrollbar-thumb{background:rgba(60,45,35,.18);border-radius:3px}
    .card.cpage{background:rgba(255,253,249,.72)}
    #inCard.cpage{justify-content:flex-start}
    .cdotrow{display:none}
    .carousel .cpage > .yaos{justify-content:flex-start;align-content:stretch}
  }
</style>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="shell">
  <div class="hero">
    <h1>六爻排盘</h1>
  </div>

  <div id="deck">
    <div class="card" id="inCard">
      <h2>排盘文本</h2>
      <p class="hint">共三页 · 左右滑动切换（输入 / 卦局与四柱 / 逐爻）</p>
      <textarea id="src" spellcheck="false" placeholder="例如：&#10;干支历:丙午年　丙申月　甲戌日　丙子时　　旬空:申酉&#10;震宫：震为雷（六冲）　之　兑宫：雷泽归妹（归魂）&#10;上爻　玄武　妻财庚戌土　世　▅　▅&#10;…&#10;&#10;· 简写：申月戌日震之归妹（月日支必填，可省年/时/天干、卦名简写）"></textarea>
      <div class="ibar">
        <button class="btn sec" onclick="document.getElementById('src').value=EXAMPLE;run()">填入示例</button>
        <button class="btn sec" onclick="document.getElementById('src').value=''">清空</button>
      </div>
      <div class="btnrow">
        <button class="btn primary" onclick="run()">开始排盘</button>
      </div>
    </div>
    <div id="err"></div>
    <div id="out"></div>
  </div>
</div>

<script>
var EXAMPLE='干支历:丙午年　丙申月　甲戌日　丙子时　　旬空:申酉\n震宫：震为雷（六冲）　之　兑宫：雷泽归妹（归魂）\n上爻　玄武　妻财庚戌土　世　▅　▅\n五爻　白虎　官鬼庚申金　　　▅　▅\n四爻　螣蛇　子孙庚午火　　　▅▅▅\n三爻　勾陈　妻财庚辰土　应　▅　▅\n二爻　朱雀　兄弟庚寅木　　　▅　▅　×　兄弟丁卯木\n初爻　青龙　父母庚子水　　　▅▅▅';

/* ============ 核心数据与算法 ============ */

/* 卦名简写→全名解析：单字八卦归其本卦；其余简名/全名匹配卦表 */
function resolveHexName(name){

/* 在文本中精确匹配卦名。
 * 规则：
 *   1) 全名/多字简名按出现位置收集（长度降序，去重叠）。
 *   2) 出现≥2个卦名 → 按先后定为 本卦/之卦（覆盖整段拷贝的标准排盘，
 *      其表头“之卦”虽含“之”，但两个卦名都在表头之后，故按顺序定夺）。
 *   3) 仅出现1个卦名 → 若它紧跟某个“之”（简写“X之Y”，Y为变卦）则作之卦，
 *     且以“之”前的八卦字定本卦；否则为“静卦”，该名即本卦。
 *   4) 完全未中 → 按“之”前后各取八卦段回退。
 * 返回 null 或 {ben, zhi}（静卦时 zhi 为 null）。 */
function extractHexes(t){
  var nameOnly=t.replace(/[（(].*?[）)]/g,"");
  var cand=[];   // 全名 + 多字简名，长度降序
  for(var i=0;i<HEX.length;i++){ var full=HEX[i][1], s=HEX[i][0];
    if(full&&cand.indexOf(full)<0)cand.push(full);
    if(s&&s.length>=2&&cand.indexOf(s)<0)cand.push(s); }
  cand.sort(function(a,b){return b.length-a.length;});
  var matches=[];
  for(var k=0;k<cand.length;k++){ var nm=cand[k], idx=0;
    while((idx=nameOnly.indexOf(nm,idx))>=0){
      var ov=false;
      for(var m=0;m<matches.length;m++){ if(idx>=matches[m].pos&&idx<matches[m].pos+matches[m].name.length){ov=true;break;} }
      if(!ov)matches.push({name:nm,pos:idx});
      idx+=nm.length;
    }
  }
  matches.sort(function(a,b){return a.pos-b.pos;});
  var ben=null,zhi=null;
  if(matches.length>=2){ ben=matches[0].name; zhi=matches[1].name; }
  else if(matches.length===1){
    var s=matches[0].name, zx=-1;
    /* 若该名紧跟某个“之”，视为简写“X之Y”，Y为变卦 */
    do{

      if(zx<0)break;

    }while(zx>=0);

      var ms=before.match(new RegExp("[^"+GUA+"()]*(["+GUA+"][\\u4e00-\\u9fa5]{0,5})$"));
      if(ms&&ms[1])ben=resolveHexName(ms[1]);

    } else { ben=s; }   /* 静卦：唯一卦名即本卦 */
  } else {
    /* 完全回退：按“之”前后各取八卦段 */
    var zi=t.indexOf("之"), GUA2="乾坤震巽坎离艮兑天雷风水火山地";
    var before2=zi>=0?nameOnly.slice(0,zi):nameOnly;
    var ms2=before2.match(new RegExp("[^"+GUA2+"()]*(["+GUA2+"][\\u4e00-\\u9fa5]{0,5})$"));
    if(ms2&&ms2[1])ben=resolveHexName(ms2[1]);
    if(zi>=0){ var after2=nameOnly.slice(zi+1); var m3=after2.match(/[\u4e00-\u9fa5]{2,4}/); if(m3)zhi=resolveHexName(m3[0]); }
  }
  if(!ben&&!zhi)return null;
  if(ben){ben=resolveHexName(ben);} if(zhi){zhi=resolveHexName(zhi);}
  return {ben:ben, zhi:zhi};
}

      window.addEventListener('mousemove',function(e){if(_isWide())return;if(_swX0==null||!_trackEl||!_carEl)return;var dx=e.clientX-_swX0,_dy=e.clientY-_swY0;_swDx=dx;_swDy=_dy;if(Math.abs(dx)>=Math.abs(_dy))_trackEl.style.transform='translateX('+(-_page*_carEl.offsetWidth+dx)+'px)';});
      window.addEventListener('mouseup',function(){if(_isWide())return;if(_swX0==null)return;if(_trackEl)_trackEl.style.transition='';_settle(_swDx,_swDy);_swX0=null;});
    }
  }
  if(inC&&inC.parentNode!==track)track.appendChild(inC);
  var kids=[].slice.call(track.children);
  kids.forEach(function(k){ if(k!==inC)track.removeChild(k); });
  var res=[]; if(out)res=[].slice.call(out.querySelectorAll(':scope > .card'));
  var pages=[].concat(inC||[],res);
  for(var pi=0;pi<pages.length;pi++){pages[pi].classList.add('cpage');pages[pi].style.height='100%';}
  res.forEach(function(p){track.appendChild(p);});
  _carEl=car;_trackEl=track;_appPages=pages;
  if(_dotsEl&&_dotsEl.parentNode)_dotsEl.parentNode.removeChild(_dotsEl);
  _dotsEl=document.createElement('div'); _dotsEl.className='cdotrow';
  for(var i=0;i<pages.length;i++){(function(k){var d=document.createElement('span');d.className='cdot'+(k===_page?' on':'');
    d.onclick=function(){_page=k;_renderPage();};_dotsEl.appendChild(d);})(i);}
  var lab=document.createElement('span'); lab.className='cdotlab'; _dotsEl.appendChild(lab);
  deck.insertBefore(_dotsEl,car.nextSibling);
  _renderPage();
}
/* —— 轻量重排：resize/键盘弹出时不重建 DOM，仅对齐当前页，避免疯狂闪动 —— */
function reflow(){
  if(_trackEl&&_carEl){ _renderPage(); } else { buildDeck(); }
}
var _ctrlRz=null;
if(window&&window.addEventListener){
  var _lastVp=0;
  function onResize(){
    var vp=(window.visualViewport&&visualViewport.width!==undefined)?visualViewport.width:window.innerWidth;
    if(Math.abs(vp-_lastVp)>2||_lastVp===0){ _lastVp=vp; clearTimeout(_ctrlRz); _ctrlRz=setTimeout(reflow,200); }
  }
  if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
  window.addEventListener("resize",onResize);
  window.addEventListener("orientationchange",function(){clearTimeout(_ctrlRz);_ctrlRz=setTimeout(buildDeck,260);});
  window.addEventListener("load",buildDeck);
}
/* 卦局特性：本宫/游魂/归魂 + 六冲/六合（由内外卦对应爻支冲合判定） */
function hexStatus(hex){
  var out=[];
  if(hex[5]===0)out.push({text:"本宫八纯",cls:"hot"});
  else if(hex[5]===6)out.push({text:"游魂",cls:"gold"});
  else if(hex[5]===7)out.push({text:"归魂",cls:"gold"});
  var brs=[0,1,2,3,4,5].map(function(pos){return lineData(hex,pos).branch;});
  var c=0,he=0;
  for(var i=0;i<3;i++){var a=DZI[brs[i]],b=DZI[brs[i+3]];
    if(CHONG[a]===b)c++; if(HE[a]===b)he++;}
  if(c===3)out.push({text:"六冲",cls:"blue"});
  if(he===3)out.push({text:"六合",cls:"green"});
  return out;
}
function guaCard(dummy,hex){
  var bd=hexStatus(hex).map(function(s){return "<span class='gb "+s.cls+"'>"+s.text+"</span>";}).join("");
  return "<div class='gua'><div class='gtop'><span class='dummy'>"+dummy+"</span><span class='nm'>"+hex[1]+"</span><span class='wc'>"+hex[8]+"</span></div>"
    +"<div class='gmeta'>"+hex[4]+"宫 · "+ORDNAME[hex[5]]+"卦"+(bd?"<span class='gbrow'>"+bd+"</span>":"")+"</div></div>";
}
